<script>
    // --- การตั้งค่า MQTT ---
    const MQTT_BROKER = "broker.hivemq.com";
    const MQTT_PORT = 8000; // ข้อสำคัญ: หน้าเว็บต้องใช้ Port 8000 สำหรับ WebSockets (ESP32 ใช้ 1883)
    const TOPIC_CMD = "myrobot/command";
    const TOPIC_STATUS = "myrobot/status";
    let mqttClient;

    // --- ระบบ Login หน้าเว็บ (Mock-up พื้นฐาน) ---
    function login() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        
        // กำหนดให้กด INITIALIZE แล้วเข้าสู่ระบบเลย
        if (user !== "" && pass !== "") { 
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            connectMQTT(); // ล็อกอินผ่านแล้วค่อยเชื่อมต่อ MQTT
        } else {
            document.getElementById('msg').innerText = "Please Enter User ID and Passcode";
        }
    }

    function logout() {
        if(mqttClient) mqttClient.disconnect();
        document.getElementById('app').style.display = 'none';
        document.getElementById('login-modal').style.display = 'flex';
        document.getElementById('user').value = '';
        document.getElementById('pass').value = '';
    }

    // --- การเชื่อมต่อ MQTT ---
    function connectMQTT() {
        // สร้าง Client ID แบบสุ่มเพื่อไม่ให้ชนกับใครเวลาเปิดหลายหน้าจอ
        const clientId = "webApp_" + Math.random().toString(16).substr(2, 8);
        mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, clientId);

        mqttClient.onConnectionLost = onConnectionLost;
        mqttClient.onMessageArrived = onMessageArrived;

        // เปลี่ยนสถานะหน้าจอเป็นกำลังเชื่อมต่อ
        document.getElementById('txt-net').innerText = "CONNECTING...";
        document.getElementById('txt-net').className = "value";

        mqttClient.connect({
            onSuccess: onConnect,
            onFailure: function (message) {
                console.log("Connection failed: " + message.errorMessage);
                setTimeout(connectMQTT, 3000); // หากต่อไม่ติด ให้ลองใหม่ใน 3 วินาที
            }
        });
    }

    // เมื่อเชื่อมต่อ MQTT สำเร็จ
    function onConnect() {
        console.log("MQTT Connected!");
        // อัปเดต UI เมื่อเชื่อมต่อสำเร็จ
        document.getElementById('txt-net').innerText = "ONLINE";
        document.getElementById('txt-net').className = "value online";
        document.getElementById('icon-net').className = "fas fa-wifi active-icon";
        
        // Subscribe รับสถานะจากรถหุ่นยนต์
        mqttClient.subscribe(TOPIC_STATUS);
    }

    // เมื่อการเชื่อมต่อ MQTT ขาดหาย
    function onConnectionLost(responseObject) {
        if (responseObject.errorCode !== 0) {
            console.log("Connection Lost: " + responseObject.errorMessage);
        }
        // อัปเดต UI เมื่อหลุด
        document.getElementById('txt-net').innerText = "OFFLINE";
        document.getElementById('txt-net').className = "value offline";
        document.getElementById('icon-net').className = "fas fa-wifi";
        setTimeout(connectMQTT, 3000); // พยายามเชื่อมต่อใหม่
    }

    // --- การรับข้อมูลอัปเดตจาก ESP32 ---
    function onMessageArrived(message) {
        try {
            // แปลงข้อมูล JSON ที่รถส่งมา (ตัวอย่างที่ ESP32 ส่ง: {"cargo":true, "status":"delivering", "room":1})
            const data = JSON.parse(message.payloadString);
            
            // 1. อัปเดตสถานะของบนรถ (Cargo)
            if (data.cargo) {
                document.getElementById('txt-cargo').innerText = "LOADED";
                document.getElementById('txt-cargo').style.color = "var(--neon-green)";
                document.getElementById('cargo-actor').style.display = "block"; // แสดงกล่องบนรถ
            } else {
                document.getElementById('txt-cargo').innerText = "EMPTY";
                document.getElementById('txt-cargo').style.color = "var(--text-main)";
                document.getElementById('cargo-actor').style.display = "none"; // ซ่อนกล่อง
            }

            // 2. อัปเดตสถานะระบบ (System Status) และขยับรถในแอนิเมชันบนหน้าเว็บ
            const robotActor = document.getElementById('robot-actor');
            if (data.status === "delivering") {
                document.getElementById('txt-status').innerText = "TO ROOM " + data.room;
                robotActor.style.left = "80%"; // ขยับรูปรถไปทางขวา (กำลังไปส่ง)
            } else if (data.status === "returning") {
                document.getElementById('txt-status'
