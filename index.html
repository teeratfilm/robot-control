<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot Cute Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* สีพาสเทล */
            --bg-mint: #d8f5eb;
            --bg-blue: #dceafc;
            --bg-pink: #fcdce8;
            --bg-yellow: #fef5d4;
            --bg-orange: #ffe8d6;
            --text-dark: #5c6270;
            --text-light: #9aa0af;
            --success: #65d09e;
            --danger: #ff8fa3;
            --info: #8db5f2;
            --stitch: rgba(0, 0, 0, 0.08); /* สีของรอยปะ */
        }

        body {
            margin: 0; padding: 20px; 
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            /* พื้นหลังไล่สีพาสเทลเหมือนท้องฟ้า */
            background: linear-gradient(135deg, #fff0f5 0%, #e0f7fa 50%, #fef5e7 100%);
            background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }

        .container {
            width: 100%; max-width: 500px;
            display: flex; flex-direction: column; gap: 12px;
        }

        /* --- กรอบแบบมีรอยปะ (Stitched Card) --- */
        .cute-card {
            border-radius: 20px;
            padding: 15px;
            /* เทคนิคทำกรอบเส้นปะด้านใน */
            border: 2px dashed var(--stitch);
            box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.4), 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
            position: relative;
        }

        /* --- Header --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-mint); padding: 15px 25px;
        }
        .logo { 
            margin: 0; font-family: 'Fredoka', sans-serif; font-size: 1.8rem; font-weight: 700; color: #7cb2a8;
        }
        .logo span { color: #f2a6b0; }
        .logo-icon { font-size: 1.2rem; margin-left: 5px; color: #8db5f2;}
        
        .btn-logout {
            background: rgba(255, 255, 255, 0.5); border: 2px solid #ffb3c1; color: #e56b82;
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-family: 'Fredoka'; font-weight: 600;
            transition: all 0.2s; box-shadow: 0 4px 0 rgba(255, 179, 193, 0.5);
        }
        .btn-logout:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(255, 179, 193, 0.5); }

        /* --- Robot Scene --- */
        .scene {
            height: 90px; background-color: var(--bg-blue); overflow: hidden;
            display: flex; align-items: center; justify-content: flex-start;
        }
        .robot-icon {
            position: absolute; left: 10%;
            font-size: 3.5rem; color: #8db5f2; transition: left 1s ease-in-out;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }
        .cargo-box {
            position: absolute; top: 0; right: -10px; font-size: 1rem;
            color: #ffd166; display: none; text-shadow: none;
        }

        /* --- Status Cards --- */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card-full { grid-column: span 2; }
        .card-title { display: block; font-size: 0.8rem; color: var(--text-light); font-weight: 800; margin-bottom: 5px;}
        .card-value { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-dark);}
        
        /* Status Colors */
        .text-online { color: var(--success); }
        .text-offline { color: var(--danger); }
        .text-active { color: var(--info); }

        /* --- System Log (Notebook Style) --- */
        .log-container {
            background-color: #fdfcee; border-color: #f2e3b6;
            padding-top: 5px;
        }
        /* เจาะรูสมุดโน้ต */
        .notebook-rings {
            height: 15px; width: 100%;
            background-image: radial-gradient(circle, #d6ccc2 4px, transparent 5px);
            background-size: 20px 15px; background-repeat: repeat-x;
            margin-bottom: 10px;
        }
        .log-header {
            font-size: 0.9rem; color: var(--success); font-weight: 800; font-family: 'Fredoka';
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px dashed #f2e3b6; padding-bottom: 8px; margin-bottom: 10px; padding-left: 10px; padding-right: 10px;
        }
        .log-box {
            height: 110px; overflow-y: auto; font-family: 'Nunito'; font-size: 0.85rem;
            color: var(--text-dark); display: flex; flex-direction: column; gap: 6px;
            text-align: left; padding: 0 10px; font-weight: 600;
        }
        .log-entry span.time { color: var(--text-light); margin-right: 5px; }

        /* --- Controls --- */
        .controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            background-color: var(--bg-mint);
        }
        .btn-room {
            border: 2px solid rgba(255,255,255,0.6); padding: 12px; border-radius: 25px;
            font-family: 'Fredoka', sans-serif; font-size: 1.1rem; font-weight: 600;
            color: var(--text-dark); cursor: pointer; transition: all 0.1s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.05);
        }
        .btn-room:active { transform: translateY(5px); box-shadow: 0 0 0 rgba(0,0,0,0.05); }
        .btn-blue { background-color: #cce4ff; color: #507fb8; }
        .btn-pink { background-color: #ffcce0; color: #b86081; }

        /* Scrollbar น่ารักๆ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #f2e3b6; border-radius: 10px; }

        /* --- Login Modal Cute --- */
        #login-modal { 
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.8); 
            display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px);
        }
        .login-box { 
            background: white; padding: 40px; border-radius: 30px; 
            text-align: center; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 3px dashed var(--bg-pink);
        }
        .input-field { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; 
            border: 2px solid var(--bg-blue); background: #f8fbff; color: var(--text-dark);
            box-sizing: border-box; font-family: 'Nunito'; font-weight: 700; font-size: 1rem;
        }
        .input-field:focus { outline: none; border-color: #8db5f2; }
        .btn-login {
            width: 100%; background: #8db5f2; color: white; padding: 15px;
            border: none; border-radius: 15px; font-family: 'Fredoka'; font-size: 1.2rem;
            margin-top: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 0 #6e98d9;
        }
        .btn-login:active { transform: translateY(5px); box-shadow: 0 0 0 #6e98d9; }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="login-box">
            <h2 style="margin-top:0; color:#8db5f2; font-family:'Fredoka'; font-size:2rem;">
                DELI<span style="color:#f2a6b0;">BOT</span> <i class="fas fa-heart" style="color:#f2a6b0; font-size:1.2rem;"></i>
            </h2>
            <input type="text" id="user" class="input-field" placeholder="User ID">
            <input type="password" id="pass" class="input-field" placeholder="Passcode">
            <button class="btn-login" onclick="login()">LET'S GO!</button>
            <p id="msg" style="color:var(--danger); font-size: 0.9rem; font-weight:bold; margin-top:15px; min-height: 20px;"></p>
        </div>
    </div>

    <div id="app" class="container" style="display:none;">
        
        <header class="cute-card">
            <h1 class="logo">DELI<span>BOT</span> <i class="fas fa-robot logo-icon"></i></h1>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i> LOGOUT</button>
        </header>

        <div class="scene cute-card">
            <div id="robot-icon" class="robot-icon">
                <i class="fas fa-robot"></i>
                <i id="cargo-icon" class="fas fa-box-open cargo-box"></i>
            </div>
        </div>

        <div class="status-grid">
            <div class="cute-card" style="background-color: var(--bg-pink);">
                <span class="card-title">CONNECTION</span>
                <span id="txt-net" class="card-value text-offline">OFFLINE</span>
            </div>
            <div class="cute-card" style="background-color: var(--bg-yellow);">
                <span class="card-title">CARGO STATUS</span>
                <span id="txt-cargo" class="card-value">EMPTY</span>
            </div>
            <div class="cute-card card-full" style="background-color: var(--bg-orange);">
                <span class="card-title">CURRENT OPERATION</span>
                <span id="txt-status" class="card-value" style="color:#c47f5a;">STANDBY</span>
            </div>
        </div>

        <div class="cute-card log-container">
            <div class="notebook-rings"></div>
            <div class="log-header">
                <span>>_ SYSTEM LOG</span>
                <button onclick="clearLog()" style="background:none; border:none; color:var(--text-light); cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
            </div>
            <div id="log-box" class="log-box"></div>
        </div>

        <div class="cute-card controls">
            <script>
                // สลับสีปุ่มฟ้า-ชมพูทีละแถว เหมือนในภาพ
                for(let i=1; i<=10; i++) {
                    let num = i < 10 ? '0'+i : i;
                    // ตรรกะสลับสีแถว: แถว 1(ฟ้า), แถว 2(ชมพู), แถว 3(ฟ้า)...
                    let isBlueRow = Math.floor((i-1)/2) % 2 === 0;
                    let btnClass = isBlueRow ? 'btn-blue' : 'btn-pink';
                    
                    document.write(`<button class="btn-room ${btnClass}" onclick="sendCmd(${i})">ROOM ${num}</button>`);
                }
            </script>
        </div>

    </div>

    <script>
        // --- MQTT Config ---
        const MQTT_HOST = "broker.hivemq.com";
        const MQTT_PORT = 8000; 
        const TOPIC_CMD = "pakkapon2006/command";
        const TOPIC_STATUS = "pakkapon2006/status";
        
        let client;
        let lastStatus = "";

        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "admin" && p === "1234") {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                addLog("System initialized. Welcome Admin! 💕", "var(--success)");
                initMQTT();
            } else {
                document.getElementById('msg').innerText = "Oops! Invalid Credentials";
            }
        }

        function logout() { location.reload(); }

        function addLog(message, color = "var(--text-dark)") {
            const logBox = document.getElementById('log-box');
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2,'0') + ":" + 
                            now.getMinutes().toString().padStart(2,'0') + ":" + 
                            now.getSeconds().toString().padStart(2,'0');
            
            const entry = document.createElement('div');
            entry.className = "log-entry";
            entry.innerHTML = `<span class="time">[${timeStr}]</span> <span style="color:${color}">${message}</span>`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight; 
        }

        function clearLog() {
            document.getElementById('log-box').innerHTML = "";
            addLog("Notebook cleared! ✨");
        }

        function initMQTT() {
            addLog("Connecting to server...", "var(--text-dark)");
            const clientId = "web_" + Math.random().toString(16).substr(2, 5);
            client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, clientId);
            
            client.onMessageArrived = (msg) => {
                try { updateUI(JSON.parse(msg.payloadString)); } catch(e) {}
            };

            client.connect({
                onSuccess: () => {
                    document.getElementById('txt-net').innerText = "ONLINE";
                    document.getElementById('txt-net').className = "card-value text-online";
                    addLog("Connected to MQTT Broker successfully! 🌐", "var(--success)");
                    client.subscribe(TOPIC_STATUS);
                },
                onFailure: () => {
                    addLog("Connection failed. Retrying... 🔄", "var(--danger)");
                    setTimeout(initMQTT, 5000);
                },
                useSSL: true
            });
        }

        function sendCmd(roomNumber) {
            if(client && client.isConnected()) {
                const payload = JSON.stringify({cmd: roomNumber});
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_CMD;
                client.send(message);
                addLog(`Command sent: Navigate to Room ${roomNumber} 🚀`, "var(--info)");
            } else {
                alert("System is currently offline! 🥺");
            }
        }

        function updateUI(data) {
            const cargoTxt = document.getElementById('txt-cargo');
            const cargoIcon = document.getElementById('cargo-icon');
            if(data.cargo) {
                cargoTxt.innerText = "LOADED";
                cargoTxt.style.color = "#d9a014";
                cargoIcon.style.display = "block";
            } else {
                cargoTxt.innerText = "EMPTY";
                cargoTxt.style.color = "var(--text-dark)";
                cargoIcon.style.display = "none";
            }

            const robot = document.getElementById('robot-icon');
            const statusTxt = document.getElementById('txt-status');
            let currentStatusStr = "";

            if(data.status === "delivering") {
                statusTxt.innerText = "EN ROUTE TO ROOM " + data.room;
                statusTxt.className = "card-value text-active";
                robot.style.left = "60%";
                currentStatusStr = `Navigating to Room ${data.room}... 🚚`;
            } 
            else if(data.status === "waiting_drop") {
                statusTxt.innerText = "WAITING FOR DROP";
                statusTxt.className = "card-value text-online";
                robot.style.left = "80%";
                currentStatusStr = `Arrived at Room ${data.room}. Waiting for cargo. 📦`;
            } 
            else if(data.status === "returning") {
                statusTxt.innerText = "RETURNING TO BASE";
                statusTxt.style.color = "#d9a014";
                robot.style.left = "30%";
                currentStatusStr = "Operation complete. Returning home. 🏠";
            } 
            else {
                statusTxt.innerText = "STANDBY (READY)";
                statusTxt.className = "card-value";
                statusTxt.style.color = "#c47f5a";
                robot.style.left = "10%";
                currentStatusStr = "Robot is on standby. 💤";
            }

            if(data.status !== lastStatus) {
                if(lastStatus !== "") addLog(currentStatusStr);
                lastStatus = data.status;
            }
        }
    </script>
</body>
</html>
