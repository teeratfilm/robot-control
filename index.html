<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot 10 Rooms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #ff007f; --secondary: #9b5de5; 
            --text-dark: #4a4a4a; --text-light: #888888;
            --success: #00bbf9; --danger: #ff4757; 
            --shadow: 0 10px 25px rgba(255, 0, 127, 0.15);
            --road-color: #fce7f3;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Poppins', sans-serif;
            background-color: #ffe6f2; background-image: url('bg.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .alert-mode { animation: pulse-red 1s infinite; background: #fff5f5 !important; }
        @keyframes pulse-red { 0% { border: 3px solid var(--danger); } 50% { border: 3px solid #fff; } 100% { border: 3px solid var(--danger); } }
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(255, 255, 255, 0.95); padding: 15px 25px; border-radius: 25px; box-shadow: var(--shadow); border: 3px solid white; }
        h1 { margin: 0; font-weight: 800; font-size: 1.6rem; color: var(--primary); }
        .btn-logout { background: #fff; border: 2px solid #ffc2d1; color: var(--secondary); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .scene-container { width: 100%; max-width: 600px; height: 140px; background: rgba(255, 255, 255, 0.9); border-radius: 25px; margin-bottom: 20px; position: relative; overflow: hidden; box-shadow: var(--shadow); border: 3px solid white; }
        .road { position: absolute; bottom: 0; width: 100%; height: 40px; background: var(--road-color); }
        .robot-actor { position: absolute; bottom: 15px; left: 20px; font-size: 3.5rem; color: var(--secondary); transition: all 1.5s; }
        .cargo-actor { position: absolute; top: -15px; right: 5px; font-size: 1.3rem; color: var(--primary); display: none; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 25px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; border: 3px solid white; transition: 0.3s; }
        .value { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }
        .off { color: var(--danger); } .on { color: var(--success); }
        
        /* Grid 10 Rooms */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .btn { background: var(--card-bg); border: 3px solid white; padding: 15px 0; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow); font-weight: 600; }
        .btn:hover { background: #fff0f5; transform: translateY(-3px); }
        .btn-home { grid-column: span 2; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: white; border: none; }
        
        .log-wrapper { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 25px; box-shadow: var(--shadow); overflow: hidden; border: 3px solid white; }
        .log-content { height: 120px; padding: 15px; overflow-y: auto; font-size: 0.8rem; }
        #login-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255, 240, 245, 0.8); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { text-align: center; width: 280px; background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(255, 0, 127, 0.2); }
        .inp { width: 100%; padding: 12px; margin: 10px 0; background: #fff0f6; border: 2px solid #ffe6f2; border-radius: 15px; text-align: center; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; font-weight: 700; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-modal">
        <div class="login-box">
            <h2 style="color:var(--primary);">Welcome! 💖</h2>
            <input type="text" id="user" class="inp" placeholder="Username">
            <input type="password" id="pass" class="inp" placeholder="Password">
            <button class="btn-login" onclick="login()">Login</button>
            <p id="msg" style="color:var(--danger); font-size:0.8rem;"></p>
        </div>
    </div>

    <div id="app" style="display:none; width:100%; flex-direction:column; align-items:center;">
        <header><h1>Deli<span>Bot</span> 🎀</h1><button class="btn-logout" onclick="logout()">Logout</button></header>
        <div class="scene-container">
            <div class="robot-actor" id="robot-actor"><i class="fas fa-robot"></i><i class="fas fa-gift cargo-actor" id="cargo-actor"></i></div>
            <div class="road"></div>
        </div>
        <div class="dashboard">
            <div class="card"><i class="fas fa-wifi"></i><span class="label">Status</span><span class="value off" id="txt-net">Offline</span></div>
            <div class="card"><i class="fas fa-cube"></i><span class="label">Cargo</span><span class="value" id="txt-cargo">Empty</span></div>
            <div class="card" id="card-status"><i class="fas fa-smile-wink" id="icon-bot"></i><span class="label">Action</span><span class="value" id="txt-status">Idle</span></div>
            <div class="card"><i class="fas fa-ruler-horizontal"></i><span class="label">Distance</span><span class="value" id="txt-dist">-- cm</span></div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="send('room1')"><i class="fas fa-store"></i> Room 1</button>
            <button class="btn" onclick="send('room2')"><i class="fas fa-store"></i> Room 2</button>
            <button class="btn" onclick="send('room3')"><i class="fas fa-store"></i> Room 3</button>
            <button class="btn" onclick="send('room4')"><i class="fas fa-store"></i> Room 4</button>
            <button class="btn" onclick="send('room5')"><i class="fas fa-store"></i> Room 5</button>
            <button class="btn" onclick="send('room6')"><i class="fas fa-store"></i> Room 6</button>
            <button class="btn" onclick="send('room7')"><i class="fas fa-store"></i> Room 7</button>
            <button class="btn" onclick="send('room8')"><i class="fas fa-store"></i> Room 8</button>
            <button class="btn" onclick="send('room9')"><i class="fas fa-store"></i> Room 9</button>
            <button class="btn" onclick="send('room10')"><i class="fas fa-store"></i> Room 10</button>
            <button class="btn btn-home" onclick="send('return')"><i class="fas fa-home"></i> Return</button>
        </div>

        <div class="log-wrapper"><div class="log-content" id="log-box">--- Ready 💖 ---</div></div>
    </div>

    <script>
        const MQTT_HOST = "broker.hivemq.com", MQTT_PORT = 8884;
        const TOPIC_CMD = "myrobot/command", TOPIC_STATUS = "myrobot/status";
        var client = null;

        function login() { if(document.getElementById("user").value==="admin" && document.getElementById("pass").value==="1234") { localStorage.setItem("isLogged", "true"); showApp(); } else { document.getElementById("msg").innerText = "Wrong Password"; } }
        function logout() { if(client) client.disconnect(); localStorage.removeItem("isLogged"); location.reload(); }
        function showApp() { document.getElementById("login-modal").style.display = "none"; document.getElementById("app").style.display = "flex"; initMQTT(); }
        if(localStorage.getItem("isLogged") === "true") showApp();

        function initMQTT() { client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, "web_"+Date.now()); client.onMessageArrived = onMessage; client.connect({ onSuccess: () => { document.getElementById("txt-net").innerText="Online"; document.getElementById("txt-net").className="value on"; client.subscribe(TOPIC_STATUS); }, useSSL: true }); }
        function send(c) { if(client && client.isConnected()) { client.send(new Paho.MQTT.Message(JSON.stringify({cmd: c}))); addLog("Sent: "+c, "info"); } else { alert("Offline!"); } }

        function onMessage(msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                const cardStatus = document.getElementById("card-status"), elStat = document.getElementById("txt-status"), icBot = document.getElementById("icon-bot");
                
                if (data.status === "lost") {
                    elStat.innerText = "OFF TRACK!"; elStat.className = "value off"; cardStatus.className = "card alert-mode"; icBot.className = "fas fa-dizzy active-icon";
                    addLog("ALERT: Lost Line!", "err");
                } else {
                    cardStatus.className = "card";
                    if(data.status === "delivering") { 
                        elStat.innerText = "Going Rm " + data.room; elStat.className = "value on"; icBot.className = "fas fa-robot active-icon";
                        document.getElementById("robot-actor").style.left = "80%"; document.getElementById("robot-actor").style.transform = "scaleX(1)";
                    } else { 
                        elStat.innerText = "Idle"; elStat.className = "value"; icBot.className = "fas fa-smile-wink";
                        document.getElementById("robot-actor").style.left = "20px"; document.getElementById("robot-actor").style.transform = "scaleX(-1)";
                    }
                }
                document.getElementById("txt-cargo").innerText = data.cargo ? "Loaded" : "Empty";
                document.getElementById("txt-dist").innerText = data.distance + " cm";
                document.getElementById("cargo-actor").style.display = data.cargo ? "block" : "none";
                if(data.distance < 30) addLog("Obstacle! 🛑", "warn");
            } catch(e) {}
        }
        function addLog(msg, type) {
            const box = document.getElementById("log-box"), time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            let css = type==="warn"?"t-warn":type==="err"?"t-err":"t-info";
            box.innerHTML += `<div class="log-line"><span class="log-time">${time}</span><span class="${css}">${msg}</span></div>`; box.scrollTop = box.scrollHeight;
        }
        function clearLog() { document.getElementById("log-box").innerHTML = '--- Log Cleared ---'; }
    </script>
</body>
</html>
