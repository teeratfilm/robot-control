<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot Pro Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c15;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-red: #ff3131;
            --neon-green: #0aff50;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 20px;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 20%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- Header --- */
        header {
            width: 100%; max-width: 500px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: var(--glass-border);
            box-shadow: var(--shadow);
        }
        h1 { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            font-weight: 700; font-size: 1.8rem; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .btn-logout {
            background: rgba(255, 49, 49, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 15px; border-radius: 8px;
            cursor: pointer; transition: 0.3s;
            font-size: 0.8rem; font-weight: 600;
        }
        .btn-logout:hover {
            background: var(--neon-red); color: #fff;
            box-shadow: 0 0 15px var(--neon-red);
        }

        /* --- Scene Animation --- */
        .scene-container {
            width: 100%; max-width: 500px; height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px; margin-bottom: 20px;
            position: relative; overflow: hidden;
            border: var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .track-line {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.1);
            z-index: 0;
        }
        .robot-actor {
            position: absolute; top: 50%; left: 20px;
            transform: translateY(-50%);
            font-size: 3rem; color: var(--neon-blue);
            transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 10px var(--neon-blue));
            z-index: 2;
        }
        .cargo-actor {
            position: absolute; top: -10px; right: -5px;
            font-size: 1rem; color: var(--neon-pink);
            animation: float 2s infinite ease-in-out;
            display: none;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- Dashboard Grid --- */
        .dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            width: 100%; max-width: 500px; margin-bottom: 25px;
        }
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px;
            border: var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.08); }
        
        .card i { font-size: 1.5rem; margin-bottom: 10px; color: var(--text-muted); transition: 0.3s; }
        .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 1.1rem; font-weight: 600; margin-top: 5px; color: #fff; font-family: 'Rajdhani', sans-serif; }

        /* Status Colors */
        .online { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .offline { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        .active-icon { color: var(--neon-blue) !important; text-shadow: 0 0 15px var(--neon-blue); }

        /* --- Alert Mode (Flash Red) --- */
        .alert-mode {
            border: 1px solid var(--neon-red) !important;
            box-shadow: 0 0 20px var(--neon-red), inset 0 0 20px rgba(255, 49, 49, 0.2) !important;
            animation: shake 0.5s infinite;
        }
        .alert-text { color: var(--neon-red) !important; font-weight: 800; letter-spacing: 1px; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } 100% { transform: translateX(0); } }

        /* --- Controls (Room Buttons) --- */
        .controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            width: 100%; max-width: 500px; margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(145deg, #1a1b26, #13141c);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            color: var(--text-muted); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1.1rem;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3), -2px -2px 5px rgba(255,255,255,0.02);
        }
        .btn:hover {
            color: #fff; border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }
        .btn:active { transform: scale(0.98); }
        .btn i { font-size: 1rem; }

        .btn-home {
            grid-column: span 2;
            background: linear-gradient(90deg, #ff00cc, #333399);
            color: white; border: none; font-size: 1.2rem;
        }
        .btn-home:hover { box-shadow: 0 0 20px rgba(255, 0, 204, 0.5); }

        /* --- Log --- */
        .log-wrapper {
            width: 100%; max-width: 500px;
            background: #000; border-radius: 15px;
            border: 1px solid #222; overflow: hidden;
            font-family: monospace; font-size: 0.8rem;
        }
        .log-header {
            padding: 8px 15px; background: #111; color: #666;
            display: flex; justify-content: space-between; border-bottom: 1px solid #222;
        }
        .log-content { height: 100px; padding: 10px; overflow-y: auto; color: #0f0; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
        .ts { color: #555; margin-right: 8px; }

        /* --- Modal --- */
        #login-modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .login-box {
            background: #161821; padding: 40px; border-radius: 20px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            text-align: center; width: 300px;
        }
        .inp {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #0b0c15; border: 1px solid #333; color: #fff;
            border-radius: 8px; text-align: center; outline: none;
        }
        .inp:focus { border-color: var(--neon-blue); }
        .btn-login {
            width: 100%; padding: 12px; margin-top: 10px;
            background: var(--neon-blue); border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="login-box">
            <h2 style="color:#fff; margin-bottom:20px;">SYSTEM <span style="color:var(--neon-blue)">ACCESS</span></h2>
            <input type="text" id="user" class="inp" placeholder="User ID">
            <input type="password" id="pass" class="inp" placeholder="Passcode">
            <button class="btn-login" onclick="login()">INITIALIZE</button>
            <p id="msg" style="color:var(--neon-red); margin-top:10px; font-size:0.8rem;"></p>
        </div>
    </div>

    <div id="app" style="display:none; width:100%; flex-direction:column; align-items:center;">
        <header>
            <h1>DELI<span>BOT</span></h1>
            <div class="btn-logout" onclick="logout()">DISCONNECT</div>
        </header>

        <div class="scene-container">
            <div class="track-line"></div>
            <div class="robot-actor" id="robot-actor">
                <i class="fas fa-robot"></i>
                <i class="fas fa-cube cargo-actor" id="cargo-actor"></i>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <i class="fas fa-wifi" id="icon-net"></i>
                <span class="label">CONNECTION</span>
                <span class="value offline" id="txt-net">OFFLINE</span>
            </div>
            <div class="card">
                <i class="fas fa-box-open" id="icon-cargo"></i>
                <span class="label">CARGO BAY</span>
                <span class="value" id="txt-cargo">EMPTY</span>
            </div>
            <div class="card" id="card-status">
                <i class="fas fa-microchip" id="icon-bot"></i>
                <span class="label">SYSTEM STATUS</span>
                <span class="value" id="txt-status">STANDBY</span>
            </div>
            <div class="card">
                <i class="fas fa-ruler-combined"></i>
                <span class="label">PROXIMITY</span>
                <span class="value" id="txt-dist">-- CM</span>
            </div>
        </div>

        <div class="controls">
            <div class="btn" onclick="send('room1')"><span>ROOM 01</span></div>
            <div class="btn" onclick="send('room2')"><span>ROOM 02</span></div>
            <div class="btn" onclick="send('room3')"><span>ROOM 03</span></div>
            <div class="btn" onclick="send('room4')"><span>ROOM 04</span></div>
            <div class="btn" onclick="send('room5')"><span>ROOM 05</span></div>
            <div class="btn" onclick="send('room6')"><span>ROOM 06</span></div>
            <div class="btn" onclick="send('room7')"><span>ROOM 07</span></div>
            <div class="btn" onclick="send('room8')"><span>ROOM 08</span></div>
            <div class="btn" onclick="send('room9')"><span>ROOM 09</span></div>
            <div class="btn" onclick="send('room10')"><span>ROOM 10</span></div>
            <div class="btn btn-home" onclick="send('return')"><i class="fas fa-undo"></i> RETURN TO BASE</div>
        </div>

        <div class="log-wrapper">
            <div class="log-header"><span>TERMINAL LOG</span><span onclick="clearLog()" style="cursor:pointer">CLR</span></div>
            <div class="log-content" id="log-box"><div class="log-line">> System Initialized...</div></div>
        </div>
    </div>

    <script>
        // *** CONFIG ***
        const MQTT_HOST = "broker.hivemq.com";
        const MQTT_PORT = 8884;
        const TOPIC_CMD = "pakkapon2006/command"; 
        const TOPIC_STATUS = "pakkapon2006/status";
        
        var client = null;

        function login() { 
            if(document.getElementById("user").value==="admin" && document.getElementById("pass").value==="1234") { 
                localStorage.setItem("isLogged", "true"); showApp(); 
            } else { document.getElementById("msg").innerText = "ACCESS DENIED"; } 
        }
        function logout() { if(client) client.disconnect(); localStorage.removeItem("isLogged"); location.reload(); }
        function showApp() { document.getElementById("login-modal").style.display = "none"; document.getElementById("app").style.display = "flex"; initMQTT(); }
        if(localStorage.getItem("isLogged") === "true") showApp();

        function initMQTT() { 
            client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, "web_"+Date.now()); 
            client.onMessageArrived = onMessage; 
            client.connect({ onSuccess: () => { 
                document.getElementById("txt-net").innerText="ONLINE"; 
                document.getElementById("txt-net").className="value online"; 
                document.getElementById("icon-net").className="fas fa-wifi online";
                client.subscribe(TOPIC_STATUS); addLog("Connected to Server");
            }, useSSL: true }); 
        }
        function send(c) { 
            if(client && client.isConnected()) { 
                client.send(new Paho.MQTT.Message(JSON.stringify({cmd: c}))); addLog("Sent: "+c); 
            } else { alert("SYSTEM OFFLINE"); } 
        }

        function onMessage(msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                const cardStatus = document.getElementById("card-status");
                const elStat = document.getElementById("txt-status");
                const icBot = document.getElementById("icon-bot");
                
                // --- Logic แจ้งเตือนหลุดเส้น ---
                if (data.status === "lost") {
                    elStat.innerText = "OFF TRACK!"; 
                    elStat.className = "value alert-text"; 
                    cardStatus.className = "card alert-mode"; 
                    icBot.className = "fas fa-exclamation-triangle alert-text";
                    addLog("CRITICAL: OFF TRACK DETECTED");
                } 
                else {
                    cardStatus.className = "card"; // คืนค่าปกติ
                    elStat.className = "value";
                    
                    if(data.status === "delivering") { 
                        elStat.innerText = "TARGET: ROOM " + data.room; 
                        icBot.className = "fas fa-robot active-icon";
                        // Animation วิ่งขวา
                        document.getElementById("robot-actor").style.left = "80%";
                    } 
                    else if(data.status === "returning") {
                        elStat.innerText = "RETURNING..."; 
                        icBot.className = "fas fa-undo active-icon";
                        // Animation วิ่งกลับซ้าย
                        document.getElementById("robot-actor").style.left = "20px";
                    }
                    else { 
                        elStat.innerText = "STANDBY"; 
                        icBot.className = "fas fa-check-circle";
                        // Reset ตำแหน่ง
                        document.getElementById("robot-actor").style.left = "20px";
                    }
                }

                // Cargo
                const hasCargo = data.cargo;
                document.getElementById("txt-cargo").innerText = hasCargo ? "LOADED" : "EMPTY";
                document.getElementById("cargo-actor").style.display = hasCargo ? "block" : "none";
                document.getElementById("icon-cargo").className = hasCargo ? "fas fa-box active-icon" : "fas fa-box-open";

                // Distance
                document.getElementById("txt-dist").innerText = data.distance + " CM";
                
                if(data.distance < 30) addLog("Warning: Obstacle Detected");

            } catch(e) {}
        }

        function addLog(msg) {
            const box = document.getElementById("log-box");
            const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            box.innerHTML += `<div class="log-line"><span class="ts">[${time}]</span>${msg}</div>`; 
            box.scrollTop = box.scrollHeight;
        }
        function clearLog() { document.getElementById("log-box").innerHTML = '<div class="log-line">> Log Cleared</div>'; }
    </script>
</body>
</html>
