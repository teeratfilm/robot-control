<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f0f13; --card-bg: rgba(30, 30, 35, 0.85); --primary: #00d4ff; --secondary: #bd00ff; 
            --text-main: #ffffff; --text-sub: #b0b0b0; --success: #00ff9d; --danger: #ff2a6d; 
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); --border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0; padding: 20px; font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0f13 0%, #1a1a2e 100%);
            color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .alert-mode { animation: pulse-red 1s infinite; background: rgba(255, 42, 109, 0.1) !important; color: var(--danger) !important; }
        @keyframes pulse-red { 0% { border-color: var(--danger); } 50% { border-color: white; } 100% { border-color: var(--danger); } }
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 15px 25px; border-radius: 20px; box-shadow: var(--shadow); border: var(--border); }
        h1 { margin: 0; font-weight: 800; font-size: 1.6rem; } h1 span { color: var(--primary); }
        .btn-logout { background: transparent; border: 2px solid var(--danger); color: var(--danger); padding: 8px 20px; border-radius: 50px; cursor: pointer; font-weight: 600; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; border: var(--border); }
        .value { font-size: 1.2rem; font-weight: 700; margin-top: 5px; } .off { color: var(--danger); } .on { color: var(--success); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); padding: 15px 0; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--text-main); font-weight: 600; }
        .btn:active { transform: scale(0.95); background: var(--primary); color: #000; }
        .btn-home { grid-column: span 2; background: linear-gradient(90deg, #ff2a6d 0%, #ff5c8d 100%); border: none; color: white; }
        .log-wrapper { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px; border: var(--border); height: 150px; overflow-y: auto; padding: 10px; font-size: 0.8rem; }
        #login-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { text-align: center; width: 280px; background: #1e1e24; padding: 40px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .inp { width: 100%; padding: 12px; margin: 10px 0; background: #2c2c35; border: 1px solid #444; border-radius: 10px; text-align: center; color: white; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; font-weight: 700; border-radius: 10px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="login-modal">
        <div class="login-box">
            <h2 style="color:white; margin-bottom:20px;">SYSTEM <span style="color:var(--primary)">LOGIN</span></h2>
            <input type="text" id="user" class="inp" placeholder="Username">
            <input type="password" id="pass" class="inp" placeholder="Password">
            <button class="btn-login" onclick="login()">ACCESS</button>
            <p id="msg" style="color:var(--danger); margin-top:15px; font-size:0.8rem;"></p>
        </div>
    </div>

    <div id="app" style="display:none; width:100%; flex-direction:column; align-items:center;">
        <header><h1>Deli<span>Bot</span></h1><button class="btn-logout" onclick="logout()">LOGOUT</button></header>
        
        <div class="dashboard">
            <div class="card"><i class="fas fa-wifi"></i><span>Status</span><span class="value off" id="txt-net">Offline</span></div>
            <div class="card" id="card-status"><i class="fas fa-robot"></i><span>Action</span><span class="value" id="txt-status">Idle</span></div>
            <div class="card"><i class="fas fa-box"></i><span>Cargo</span><span class="value" id="txt-cargo">Empty</span></div>
            <div class="card"><i class="fas fa-ruler"></i><span>Distance</span><span class="value" id="txt-dist">-- cm</span></div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="send('room1')">Room 1</button> <button class="btn" onclick="send('room2')">Room 2</button>
            <button class="btn" onclick="send('room3')">Room 3</button> <button class="btn" onclick="send('room4')">Room 4</button>
            <button class="btn" onclick="send('room5')">Room 5</button> <button class="btn" onclick="send('room6')">Room 6</button>
            <button class="btn" onclick="send('room7')">Room 7</button> <button class="btn" onclick="send('room8')">Room 8</button>
            <button class="btn" onclick="send('room9')">Room 9</button> <button class="btn" onclick="send('room10')">Room 10</button>
            <button class="btn btn-home" onclick="send('return')">RETURN BASE</button>
        </div>

        <div class="log-wrapper" id="log-box">--- System Ready ---</div>
    </div>

    <script>
        // *** แก้ชื่อ Topic ให้ตรงกับ Arduino ***
        const MQTT_HOST = "broker.hivemq.com";
        const MQTT_PORT = 8884;
        const TOPIC_CMD = "pakkapon2006/command"; 
        const TOPIC_STATUS = "pakkapon2006/status";
        
        var client = null;

        function login() { 
            if(document.getElementById("user").value==="admin" && document.getElementById("pass").value==="1234") { 
                localStorage.setItem("isLogged", "true"); showApp(); 
            } else { document.getElementById("msg").innerText = "ACCESS DENIED"; } 
        }
        function logout() { if(client) client.disconnect(); localStorage.removeItem("isLogged"); location.reload(); }
        function showApp() { document.getElementById("login-modal").style.display = "none"; document.getElementById("app").style.display = "flex"; initMQTT(); }
        if(localStorage.getItem("isLogged") === "true") showApp();

        function initMQTT() { 
            client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, "web_"+Date.now()); 
            client.onMessageArrived = onMessage; 
            client.connect({ onSuccess: () => { 
                document.getElementById("txt-net").innerText="ONLINE"; document.getElementById("txt-net").className="value on"; 
                client.subscribe(TOPIC_STATUS); addLog("Connected to Server");
            }, useSSL: true }); 
        }
        function send(c) { 
            if(client && client.isConnected()) { 
                client.send(new Paho.MQTT.Message(JSON.stringify({cmd: c}))); addLog("Sent: "+c); 
            } else { alert("OFFLINE"); } 
        }

        function onMessage(msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                const elStat = document.getElementById("txt-status");
                const cardStatus = document.getElementById("card-status");
                
                if (data.status === "lost") {
                    elStat.innerText = "OFF TRACK!"; elStat.className = "value off";
                    cardStatus.className = "card alert-mode"; addLog("ALERT: Robot Lost Line!");
                } else {
                    cardStatus.className = "card";
                    if(data.status === "delivering") { elStat.innerText = "Going Rm " + data.room; elStat.className = "value on"; }
                    else if(data.status === "returning") { elStat.innerText = "Returning"; elStat.className = "value on"; }
                    else { elStat.innerText = "Idle"; elStat.className = "value"; }
                }
                document.getElementById("txt-cargo").innerText = data.cargo ? "LOADED" : "EMPTY";
                document.getElementById("txt-dist").innerText = data.distance + " cm";
            } catch(e) {}
        }
        function addLog(msg) {
            const box = document.getElementById("log-box");
            box.innerHTML += `<div>> ${msg}</div>`; box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
