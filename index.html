<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot Pro - pakkapon2006</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c15;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --neon-blue: #00f3ff;
            --neon-green: #0aff50;
            --neon-red: #ff3131;
            --text-main: #ffffff;
        }

        body {
            margin: 0; padding: 20px; font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        header {
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px; background: var(--glass-bg);
            padding: 15px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .scene-container {
            width: 100%; max-width: 500px; height: 100px; background: rgba(0,0,0,0.3);
            border-radius: 20px; margin-bottom: 20px; position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .robot-actor {
            position: absolute; top: 50%; left: 10%; transform: translateY(-50%);
            font-size: 2.5rem; color: var(--neon-blue); transition: left 1s ease-in-out;
        }

        .cargo-box { 
            position: absolute; top: -10px; right: -5px; 
            font-size: 0.8rem; color: var(--neon-green); display: none; 
        }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        .card { background: var(--glass-bg); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .value { display: block; font-size: 1.1rem; font-weight: bold; margin-top: 5px; font-family: 'Rajdhani'; }
        .online { color: var(--neon-green); }
        .offline { color: var(--neon-red); }

        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 500px; }
        .btn {
            background: #1a1b26; border: 1px solid var(--neon-blue); padding: 15px;
            border-radius: 10px; color: #fff; cursor: pointer; font-weight: bold;
            transition: 0.3s; text-align: center;
        }
        .btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .btn:active { transform: scale(0.95); }

        #login-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: #161821; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--neon-blue); }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; outline: none; }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="login-box">
            <h2 style="color:var(--neon-blue); font-family:'Rajdhani'">SYSTEM LOGIN</h2>
            <input type="text" id="user" placeholder="User ID">
            <input type="password" id="pass" placeholder="Passcode">
            <button class="btn" style="width:100%; margin-top: 10px;" onclick="login()">INITIALIZE</button>
            <p id="msg" style="color:var(--neon-red)"></p>
        </div>
    </div>

    <div id="app" style="display:none; width:100%; flex-direction:column; align-items:center;">
        <header>
            <h2 style="margin:0; font-family:'Rajdhani'">DELI<span style="color:var(--neon-blue)">BOT</span></h2>
            <button onclick="logout()" style="background:none; border:1px solid var(--neon-red); color:var(--neon-red); cursor:pointer; border-radius:5px; padding: 5px 15px;">LOGOUT</button>
        </header>

        <div class="scene-container">
            <div id="robot-actor" class="robot-actor">
                <i class="fas fa-robot"></i>
                <i id="cargo-actor" class="fas fa-box cargo-box"></i>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <span style="font-size:0.7rem; color:#888;">CONNECTION</span>
                <span id="txt-net" class="value offline">OFFLINE</span>
            </div>
            <div class="card">
                <span style="font-size:0.7rem; color:#888;">CARGO STATUS</span>
                <span id="txt-cargo" class="value">EMPTY</span>
            </div>
            <div class="card" style="grid-column: span 2;">
                <span style="font-size:0.7rem; color:#888;">BOT STATUS</span>
                <span id="txt-status" class="value">IDLE (READY)</span>
            </div>
        </div>

        <div class="controls">
            <script>
                // ส่งค่าพารามิเตอร์เป็นเลขจำนวนเต็มตรงๆ เพื่อให้ ESP32 เอาไป if (num % 2) ได้ง่าย
                for(let i=1; i<=10; i++) {
                    document.write(`<div class="btn" onclick="sendCmd(${i})">GO TO ROOM ${i < 10 ? '0'+i : i}</div>`);
                }
            </script>
        </div>
    </div>

    <script>
        const MQTT_HOST = "broker.hivemq.com";
        const MQTT_PORT = 8000; 
        const TOPIC_CMD = "pakkapon2006/command";
        const TOPIC_STATUS = "pakkapon2006/status";
        
        let client;

        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "admin" && p === "1234") {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initMQTT();
            } else {
                document.getElementById('msg').innerText = "Invalid Credentials";
            }
        }

        function logout() { location.reload(); }

        function initMQTT() {
            const clientId = "web_" + Math.random().toString(16).substr(2, 5);
            client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, clientId);
            
            client.onMessageArrived = (msg) => {
                try {
                    const data = JSON.parse(msg.payloadString);
                    updateUI(data);
                } catch(e) { console.log("JSON Parse Error: ", e); }
            };

            client.connect({
                onSuccess: () => {
                    document.getElementById('txt-net').innerText = "ONLINE";
                    document.getElementById('txt-net').className = "value online";
                    client.subscribe(TOPIC_STATUS);
                },
                onFailure: () => {
                    setTimeout(initMQTT, 5000); // Auto reconnect
                },
                useSSL: true // ใช้ https/wss ควรเปิด SSL
            });
        }

        function sendCmd(roomNumber) {
            if(client && client.isConnected()) {
                const payload = JSON.stringify({cmd: roomNumber});
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = TOPIC_CMD;
                client.send(message);
            } else {
                alert("MQTT Disconnected!");
            }
        }

        function updateUI(data) {
            const cargoTxt = document.getElementById('txt-cargo');
            const cargoIcon = document.getElementById('cargo-actor');
            if(data.cargo) {
                cargoTxt.innerText = "LOADED";
                cargoTxt.style.color = "#0aff50";
                cargoIcon.style.display = "block";
            } else {
                cargoTxt.innerText = "EMPTY";
                cargoTxt.style.color = "#fff";
                cargoIcon.style.display = "none";
            }

            const robot = document.getElementById('robot-actor');
            const statusTxt = document.getElementById('txt-status');

            if(data.status === "delivering") {
                statusTxt.innerText = "DELIVERING TO ROOM " + data.room;
                statusTxt.style.color = "#00f3ff";
                robot.style.left = "60%";
            } else if(data.status === "waiting_drop") {
                statusTxt.innerText = "ARRIVED - WAITING DROP";
                statusTxt.style.color = "#0aff50";
                robot.style.left = "85%";
            } else if(data.status === "returning") {
                statusTxt.innerText = "RETURNING HOME...";
                statusTxt.style.color = "#ffaa00";
                robot.style.left = "30%";
            } else {
                statusTxt.innerText = "IDLE (READY)";
                statusTxt.style.color = "#fff";
                robot.style.left = "10%";
            }
        }
    </script>
</body>
</html>
